<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <!-- Textura completa -->
  <img src="IMG/textura.png" alt="Textura de fondo" class="background-texture">

  <img src="IMG/Blandaarribaizquierda.png" alt="Blanda superior derecha" class="liquid-shape top-right">

  <!-- Contenedor principal de la pantalla -->
  <div class="card-container card-transparent layout-quiz-screen">

    <!-- Cabecera del Quiz -->
    <div class="quiz-header">
      <h1 class="quiz-main-title">Poné a prueba lo que aprendiste:</h1>
      <p class="quiz-subtitle">Respondé las siguientes preguntas y descubrí cuánto recordás de la presentación.</p>
    </div>

    <!-- Contenedor tipo marco con borde degradado -->
    <div class="quiz-gradient-box correct-box">
      
      <!-- Cerebro arriba a la derecha -->
      <div class="brain-overlay-container">
        <img src="IMG/cerebro.png" alt="Cerebro IA" class="brain-img-overlay">
      </div>

      <!-- Contenido del resultado -->
      <div class="correct-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 15px;">
        
        <!-- Título ACERTASTE -->
        <div class="stat-img-container" style="width: 280px; height: 60px;">
          <img src="IMG/acertaste.png" alt="ACERTASTE" class="stat-circle-img">
        </div>

        <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 10px;">
          
          <!-- Imagen del número 3 -->
          <div style="width: 70px; height: 90px; display: flex; align-items: center; justify-content: center;">
            <img src="IMG/3.png" alt="3" style="width: 100%; height: 100%; object-fit: contain;">
          </div>

          <!-- Línea separadora -->
          <div style="width: 25px; height: 90px; display: flex; align-items: center; justify-content: center;">
            <img src="IMG/linea.png" alt="Línea" style="width: 100%; height: 100%; object-fit: contain;">
          </div>

          <!-- Imagen del total (5) -->
          <div style="width: 70px; height: 90px; display: flex; align-items: center; justify-content: center;">
            <img src="IMG/5.png" alt="5" style="width: 100%; height: 100%; object-fit: contain;">
          </div>

        </div>

        <!-- Botón para finalizar -->
        <div class="correct-actions" style="margin-top: 15px;">
          <a href="pagina16.html" class="action-pill-btn-center">FINALIZAR</a>
        </div>
      </div>

    </div>

      <a href="pagina16.html" class="nav-btn next-btn" title="Reflexión Final">
