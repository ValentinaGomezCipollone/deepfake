<body>

  <!-- Textura completa -->
  <img src="IMG/textura.png" alt="Textura de fondo" class="background-texture">

  <img src="IMG/Blandadegradadamulticolor.png" alt="Blanda" class="liquid-shape bottom-left">
  <img src="IMG/Blandaarribaizquierda.png" alt="Blanda superior derecha" class="liquid-shape top-right">


  <!-- Contenedor principal de la pantalla -->
  <div class="card-container card-transparent layout-quiz-screen">

    <!-- Cabecera del Quiz -->

      <h1 class="quiz-main-title">Poné a prueba lo que aprendiste:</h1>

    <div class="quiz-gradient-box correct-box">

      <div class="quiz-top-left-group">
        <div class="estrellas-container">
          <img src="IMG/estrella.png" alt="Estrellas" class="estrellas-img">
        </div>
        <div class="question-number-badge">4</div>
      </div>

      <div class="brain-overlay-container">
        <img src="IMG/cerebro.png" alt="Cerebro IA" class="brain-img-overlay">
      </div>

      <div class="correct-content">
        <!-- Cartel verde de Correcto -->
        <div class="correct-badge">
          <span>¡CORRECTO!</span>
        </div>

        <!-- Estadística aclaratoria con la imagen del 74% -->
        <div class="stat-explanation-row">
          <div class="stat-img-container">
            <img src="IMG/74.png" alt="74%" class="stat-circle-img">

          <span class="stat-explanation-desc">está de acuerdo en que la IA no debería utilizarse para clonar o suplantar artistas sin autorización.</span>

        <div class="correct-actions">

        </div>

    <div class="navigation-bar">
      <a href="pagina14.html" class="nav-btn prev-btn" title="Anterior">
        <span>‹</span>
      </a>
      <div class="page-counter">
        <span class="current-page">19</span>
        <span class="separator">/</span>

  <script src="script.js"></script>
  <script>
  // Sumamos 1 punto cada vez que acierta
  let puntajeActual = parseInt(localStorage.getItem('puntajeQuiz')) || 0;
  localStorage.setItem('puntajeQuiz', puntajeActual + 1);
